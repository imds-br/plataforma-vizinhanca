[project]
name = "infrabr"
version = "0.1.0"
description = "Replication package for the Imds neighborhoods project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dask>=2025.5.1",
    "dask-geopandas>=0.5.0",
    "geobr>=0.2.2",
    "geospatial>=0.11.6",
    "h3>=4.3.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0",
    "python-dotenv>=1.2.3",
    "rpy2>=3.6.1",
    "ruff>=0.12.1",
    "swifter>=1.4.0",
]
